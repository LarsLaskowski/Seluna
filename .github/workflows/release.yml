name: Release

# The maintainer creates the release and its tag on GitHub and publishes it as a pre-release; this workflow
# verifies the tagged commit and only then turns the pre-release into the latest full release (decision 0009).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-latest
    steps:
      - name: Warn about a release published without the pre-release step
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          printf '::warning::Release %s was published as a full release, before these checks ran; publish releases as a pre-release so the workflow promotes them once the checks pass.\n' "$TAG"

      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
          LC_ALL: C
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Tag %s is not a release tag; expected vMAJOR.MINOR.PATCH, for example v1.2.3.\n' "'$TAG'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            printf '::error::Tag %s points to a commit that is not on main; releases are cut from main only.\n' "$TAG"
            exit 1
          fi

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg="$(jq -r .version package.json)"
          if [[ $pkg != "$version" ]]; then
            printf '::error::Tag %s does not match version %s in package.json; set "version" to %s before releasing.\n' "$TAG" "$pkg" "$version"
            exit 1
          fi

      - name: Check changelog section
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          HEADING="## [$version]" awk '
            BEGIN { h = ENVIRON["HEADING"] }
            !found { if ($0 == h || index($0, h " ") == 1) { found = 1 } next }
            /^## / || /^\[[^]]+\]: / { exit }
            /^[[:space:]]*$/ { if (started) { blanks = blanks $0 "\n" } next }
            { started = 1; printf "%s", blanks; blanks = ""; print }
          ' CHANGELOG.md > "${RUNNER_TEMP:-/tmp}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP:-/tmp}/release-notes.md"; then
            printf '::error::CHANGELOG.md has no entries under "## [%s]"; move the Unreleased entries to that section before releasing.\n' "$version"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  promote:
    name: Promote to full release
    needs: verify
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag still points to the verified commit
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha)"
          if [[ $current != "$GITHUB_SHA" ]]; then
            printf '::error::Tag %s no longer points to the verified commit %s; it was moved during the run. Delete the release and its tag, then create the release again.\n' "$TAG" "$GITHUB_SHA"
            exit 1
          fi

      - name: Check release is still a pre-release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [[ $prerelease != true ]]; then
            printf '::error::Release %s is no longer a pre-release; it was changed during the run, so the workflow leaves it as it is.\n' "$TAG"
            exit 1
          fi

      - name: Promote to latest full release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
