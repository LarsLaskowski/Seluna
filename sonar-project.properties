sonar.projectKey=LarsLaskowski_Seluna
sonar.organization=larslaskowski

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
