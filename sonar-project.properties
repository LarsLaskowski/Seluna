sonar.projectKey=networlddev_seluna
sonar.organization=networlddev

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,dist/**,coverage/**

# The language tables in src/setup/texts.ts share their keys and order on purpose; copy-paste detection
# ignores string values and reports them as duplicates (decision 0019). Excluded from CPD only.
sonar.cpd.exclusions=src/setup/texts.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Squad and agent tooling is developer tooling, not production code.
sonar.coverage.exclusions=.squad/**,.claude/**,**/*.d.ts
